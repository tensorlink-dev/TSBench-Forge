  notes: "[VERIFIED 2026-07-01 + scraper patched:] Original URL `{YYYY-MM-DD}-{H}.json.gz` failed\nwith\
    \ \"unresolved placeholders ['H']\" because the scraper's `expand_url` only handled\nstatic date tokens,\
    \ and there was no `panel:` defining H. Two fixes applied:\n  (a) scraper.py extended: `expand_url`\
    \ now substitutes `{H}` (current UTC hour),\n      `{HH}` (zero-padded), and the offset form `{H-N}`\
    \ (e.g. `{H-1}` = previous hour).\n  (b) URL token changed `{H}` → `{H-1}` because gharchive publishes\
    \ ~30-60 min after\n      the hour ends; fetching the *current* hour usually 404s, so target the *previous*\n\
    \      hour for reliable retrieval.\nEach hourly file is ~30-50 MB compressed. Per-minute counts derived\
    \ from\nevent.created_at within the file. Sister of github_events_firehose (noisy realtime\nsample)\
    \ — same population, different fidelity.\n"
