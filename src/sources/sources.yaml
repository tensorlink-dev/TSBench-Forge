  license: Norwegian Public Roads Administration open data (NLOD)
  notes: 'Hourly vehicle counts from a Norwegian Public Roads Administration traffic registration point
    in central Oslo (point 17684V2460285), via the keyless Trafikkdata GraphQL API. New host. Gotcha: the
    byHour connection pages at 100 edges, so the query window is kept to ~4 days ({YYYY-MM-DD-4d} .. today)
    — a wider window silently truncates and leaves the newest hours out. Counts lag real time by roughly
    an hour or two.'
  endpoint:
    url: https://trafikkdata-api.atlas.vegvesen.no/
    type: graphql
    method: POST
    body:
      query: '{trafficData(trafficRegistrationPointId:"17684V2460285"){volume{byHour(from:"{YYYY-MM-DD-4d}T00:00:00+02:00",to:"{YYYY-MM-DD}T23:00:00+02:00"){edges{node{from
        total{volumeNumbers{volume}}}}}}}}'
  schema:
    timestamp_field: data.trafficData.volume.byHour.edges[].node.from
    value_field:
    - data.trafficData.volume.byHour.edges[].node.total.volumeNumbers.volume
