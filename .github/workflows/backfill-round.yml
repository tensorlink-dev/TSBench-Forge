name: backfill-round

# Score models added after a round ran on that round's exact challenges, and
# merge them into its published leaderboard (scripts/backfill_round.py). Needs
# the round's mirror cache (hippius-mirror-<run id>, GitHub keeps it 7 days
# after last use) and its paracast-round-results artifact (30 days). Nothing is
# re-queried from Ephemeris; existing rows do not change.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "paracast-round run id that produced the round"
        required: true
      round_id:
        description: "round to backfill, e.g. 2026-10-06"
        required: true
      models:
        description: "models to add"
        required: true
        default: "timesfm3,toto2-2.5b,toto2-22m,toto2-4m"

# Shares the round's group: both write docs/data/rounds and push.
concurrency:
  group: paracast-round
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: ${{ inputs.run_id }}
      ROUND_ID: ${{ inputs.round_id }}
      MODELS: ${{ inputs.models }}
      LIUM_API_KEY: ${{ secrets.LIUM_API_KEY }}
      LIUM_SSH_KEY: ${{ secrets.LIUM_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy scipy pyarrow pyyaml pandas freezegun lium-io==0.0.24

      - name: Restore the round's exact mirror snapshot
        uses: actions/cache/restore@v4
        with:
          path: src/sources/data
          key: hippius-mirror-${{ inputs.run_id }}
          fail-on-cache-miss: true

      - name: Fetch the round's per-challenge scores
        uses: actions/download-artifact@v5
        with:
          name: paracast-round-results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: round-results

      - name: Rebuild and verify the challenges, export contexts
        run: |
          python scripts/backfill_round.py export \
            --results round-results/results.json \
            --round-doc "docs/data/rounds/${ROUND_ID}.json" \
            --contexts ref/contexts.npz

      - name: Forecast on a rented GPU
        run: |
          mkdir -p ~/.lium ~/.ssh
          # lium-io 0.0.24 ignores [ssh] key_path and only discovers ~/.ssh/id_ed25519.
          printf '%s\n' "$LIUM_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          printf '[api]\napi_key = %s\n' "$LIUM_API_KEY" > ~/.lium/config.ini
          bash scripts/run_reference_pod.sh ref/contexts.npz ref/out "$MODELS"

      - name: Score, merge and republish the round
        run: |
          python scripts/backfill_round.py publish \
            --results round-results/results.json \
            --round-doc "docs/data/rounds/${ROUND_ID}.json" \
            --reference-forecasts ref/out --models "$MODELS"

      - name: Commit the backfilled round
        run: |
          git config user.name "tsbench-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/rounds
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "round: backfill ${MODELS} into ${ROUND_ID}"
          git push || (git pull --rebase && git push)

      - name: Upload the extended results
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-round-results
          path: notebooks/results/group_paracast/
          retention-days: 30
