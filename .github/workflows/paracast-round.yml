# Scheduled leaderboard round, scored through the paracast endpoint.
#
# The old publication path needed a human to rent a Lium GPU pod, run the
# comparison, merge and commit — so rounds happened rarely. paracast keeps the
# open-weights panel loaded behind one HTTP endpoint, which turns a round into
# a CPU-only client loop this workflow can run on a schedule. Committing
# docs/data/ republishes the GitHub Pages feed, which the cascade-frontend
# tracker polls — that chain is what makes the public leaderboard live.
#
# Runs after each scrape sweep (scrape-data.yml at 01:17/13:17 UTC) so the
# challenge pool includes the freshest data. Round identity is the UTC date:
# the second run of a day OVERWRITES that date's round with fresher data,
# which is the published contract ("a round is the latest result for its
# date"), so the feed updates twice daily while history stays one round/day.
#
# SECRETS (Settings -> Secrets and variables -> Actions):
#   PARACAST_URL            required — the deployed chute's base URL
#   PARACAST_API_KEY        optional — bearer token if the gateway needs one
#   HIPPIUS_S3_ACCESS_KEY   required — pulls the scraped parquet mirror
#   HIPPIUS_S3_SECRET_KEY   required
#   HIPPIUS_S3_ENDPOINT     optional (default https://s3.hippius.com)
#   HIPPIUS_S3_BUCKET       optional (default tsbench-forge-sources)

name: Paracast leaderboard round

on:
  schedule:
    # ~90 min after each scrape sweep lands in the mirror.
    - cron: "47 2,14 * * *"
  workflow_dispatch:
    inputs:
      runner_args:
        description: "Extra args for run_paracast_round.py (e.g. --round-id 2026-08-13 --note backfill)"
        required: false
        default: ""

# One round at a time: two runs would race on docs/data/rounds and the git push.
concurrency:
  group: paracast-round
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  round:
    runs-on: ubuntu-latest
    # The first run after a cache miss still pays the full mirror pull, which
    # is what exhausted the old 120-minute budget before the round even began.
    timeout-minutes: 240
    env:
      PARACAST_URL: ${{ secrets.PARACAST_URL }}
      PARACAST_API_KEY: ${{ secrets.PARACAST_API_KEY }}
      HIPPIUS_S3_ACCESS_KEY: ${{ secrets.HIPPIUS_S3_ACCESS_KEY }}
      HIPPIUS_S3_SECRET_KEY: ${{ secrets.HIPPIUS_S3_SECRET_KEY }}
      HIPPIUS_S3_ENDPOINT: ${{ secrets.HIPPIUS_S3_ENDPOINT }}
      HIPPIUS_S3_BUCKET: ${{ secrets.HIPPIUS_S3_BUCKET }}
      # Job-level so the mirror step can gate on it: the `secrets` context
      # is not available in a step `if`, but `env` is.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # numpy is the core; scipy for the paired tests; pyarrow/pyyaml/pandas
        # to read the scraped catalog; boto3 for the mirror pull.
        run: pip install numpy scipy pyarrow pyyaml pandas boto3

      - name: Missing-secret guard
        if: env.PARACAST_URL == '' || env.HIPPIUS_S3_ACCESS_KEY == ''
        run: |
          echo "PARACAST_URL and the HIPPIUS_S3_* secrets are required to run a round."
          exit 1

      - name: Cache the scraped mirror
        # sync_storage.py --download already skips any file whose size matches
        # (the bucket is append-only), so the pull is incremental — but only if
        # the directory survives. On a fresh runner it does not, so every run
        # re-pulled the whole mirror. That took longer than the job's entire
        # timeout: run 33066481350 spent all 120 minutes here and was cancelled
        # before it ever reached the round.
        #
        # run_id in the key means this never hits exactly and always saves a
        # fresh cache; restore-keys pulls the most recent previous one. That is
        # the rolling-cache pattern for a monotonically growing dataset.
        uses: actions/cache@v4
        with:
          path: src/sources/data
          key: hippius-mirror-${{ github.run_id }}
          restore-keys: |
            hippius-mirror-

      - name: Pull scraped data from Hippius
        # Full mirror, not --today: challenge construction needs motif_len
        # (304) points of history per series, which spans many dated files.
        # The bucket is append-only, so this is the round's data snapshot.
        run: |
          before=$(du -sm src/sources/data 2>/dev/null | cut -f1 || echo 0)
          start=$(date +%s)
          python src/sources/sync_storage.py --download
          echo "mirror pull: $(( $(date +%s) - start ))s, ${before} MB cached -> $(du -sm src/sources/data | cut -f1) MB"

      - name: Wake paracast and wait for the panel
        # The chute scales to zero when idle, so it is normally DOWN when this
        # workflow fires. The first request is what triggers the cold start --
        # seven worker processes each loading a checkpoint -- so poll rather
        # than fail on the first 503. run_paracast_round.py calls /health once
        # and exits(1), which is right for interactive use but would abort the
        # round here.
        #
        # Nothing shuts it down afterwards: Chutes has no stop API. The chute
        # idles itself down after its own shutdown_after_seconds, which is why
        # this workflow no longer needs the endpoint kept up permanently.
        run: |
          set -uo pipefail
          auth=()
          if [ -n "${PARACAST_API_KEY:-}" ]; then
            auth=(-H "Authorization: Bearer ${PARACAST_API_KEY}")
          fi
          # ${arr[@]+...} so an empty auth array is not an unbound-variable
          # error under `set -u`.
          probe() { curl -sf -m 30 ${auth[@]+"${auth[@]}"} "${PARACAST_URL}/health" 2>/dev/null; }
          field() { printf '%s' "$1" | python -c "import json,sys;d=json.load(sys.stdin);print($2)" 2>/dev/null; }

          up_wait="${PARACAST_UP_TIMEOUT:-1800}"   # 30 min to answer at all
          ok_wait="${PARACAST_OK_TIMEOUT:-300}"    # then 5 more for every worker
          up_deadline=$(( $(date +%s) + up_wait ))

          echo "waking ${PARACAST_URL} ..."
          until body=$(probe); do
            if [ "$(date +%s)" -ge "${up_deadline}" ]; then
              echo "::error::paracast did not answer /health within ${up_wait}s"
              exit 1
            fi
            echo "  cold, still starting ..."
            sleep 20
          done

          # A 200 only means the router is up; workers load independently and
          # the panel is allowed to serve degraded. Scoring a public
          # leaderboard against half a panel would quietly change what the
          # numbers mean, so give the stragglers a little longer first.
          ok_deadline=$(( $(date +%s) + ok_wait ))
          while [ "$(field "${body}" 'd.get("status","")')" != "ok" ]; do
            if [ "$(date +%s)" -ge "${ok_deadline}" ]; then
              echo "::warning::proceeding with a degraded panel; unhealthy: $(field "${body}" '",".join(d.get("unhealthy",[])) or "?"')"
              break
            fi
            echo "  panel $(field "${body}" 'd.get("status","?")'), waiting for all workers ..."
            sleep 15
            body=$(probe) || true
          done

          echo "panel $(field "${body}" 'd.get("status")') -- $(field "${body}" 'len(d.get("healthy",[]))') healthy workers"

      - name: Run the round
        run: |
          python scripts/run_paracast_round.py \
            --data-dir src/sources/data \
            --publish --feedback all \
            ${{ github.event.inputs.runner_args }}

      - name: Commit the published round
        run: |
          git config user.name "tsbench-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/rounds docs/data/models.json
          if git diff --cached --quiet; then
            echo "round produced no feed change — nothing to commit"
            exit 0
          fi
          git commit -m "round: publish paracast-scored round $(date -u +%F)"
          # The scrape workflow does not push to the repo, but a human might;
          # rebase-retry once rather than failing the whole round on a race.
          git push || (git pull --rebase && git push)

      - name: Mirror round manifest to Hugging Face
        # Optional: publishes each round JSON (leaderboard + the DEC-TB-0003
        # composition manifest) plus the index to a public HF dataset, so the
        # per-round domain mix is inspectable off-GitHub too. No-op until the
        # HF_TOKEN secret (a write token for the tensorlink-dev org) is set.
        if: env.HF_TOKEN != ''
        run: |
          pip install --quiet huggingface_hub
          python - <<'EOF'
          from huggingface_hub import HfApi
          api = HfApi()
          repo = "tensorlink-dev/tsbench-forge-rounds"
          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          api.upload_folder(
              folder_path="docs/data/rounds",
              path_in_repo="rounds",
              repo_id=repo, repo_type="dataset",
              commit_message="round: mirror published rounds",
          )
          print(f"mirrored docs/data/rounds -> hf://datasets/{repo}/rounds")
          EOF

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paracast-round-results
          path: notebooks/results/group_paracast/
          if-no-files-found: ignore
          retention-days: 30
