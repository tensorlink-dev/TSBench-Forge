# Export one round's challenges (contexts, truths, tags) as an artifact, for
# scoring candidate ensembles offline on hardware that must not hold the
# mirror credentials. Builds exactly what run_paracast_round.py would score.
# Publishes nothing and calls no endpoint.

name: Export round challenges

on:
  push:
    branches: [verify-ensemble-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      HIPPIUS_S3_ACCESS_KEY: ${{ secrets.HIPPIUS_S3_ACCESS_KEY }}
      HIPPIUS_S3_SECRET_KEY: ${{ secrets.HIPPIUS_S3_SECRET_KEY }}
      HIPPIUS_S3_ENDPOINT: ${{ secrets.HIPPIUS_S3_ENDPOINT }}
      HIPPIUS_S3_BUCKET: ${{ secrets.HIPPIUS_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pyarrow pyyaml pandas boto3
      - name: Restore the scraped mirror
        uses: actions/cache/restore@v4
        with:
          path: src/sources/data
          key: hippius-mirror-none
          restore-keys: |
            hippius-mirror-
      - name: Top up the mirror
        run: |
          set +e
          timeout 5400 python src/sources/sync_storage.py --download
          echo "pull rc=$? ($(du -sm src/sources/data | cut -f1) MB)"
      - name: Export
        run: python scripts/export_round_challenges.py --out round_challenges.npz
      - uses: actions/upload-artifact@v4
        with:
          name: round-challenges
          path: round_challenges.npz
          retention-days: 7
